[project]
name = "persist"
version = "0.1.0"
description = "PERSIST-GNN: lineage-supervised prediction of pre-existing drug-tolerant cell states (ReSisTrace)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "anndata>=0.10",
    "scanpy>=1.10",
    "scikit-learn>=1.4",
    "catboost>=1.2",
    "torch>=2.3",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "lifelines>=0.28",
    "tabulate>=0.10.0",
    "gseapy>=1.3.1",
    "rds2py>=0.10.6",
    "infercnvpy>=0.6.1",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
